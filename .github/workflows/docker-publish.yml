name: CI - Node.js

on:
  push:
    branches: [ main, development, staging ]
  pull_request:
    branches: [ main, development, staging ]
  workflow_dispatch:

jobs:
  test:
    name: Install, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
